manifestVersion: 1
name: "@tagur/oidc-diagnose"
version: 2026.10.15.1
license: MIT
paths:
  base: manifest
description: |
  IdP-agnostic OpenID Connect diagnostics for swamp — read-only
  troubleshooting of broken login flows against any standards-compliant
  provider (Okta, Auth0, Entra ID, Keycloak, Zitadel, Cognito, Google, …).

  No credentials and no vault required: the model exercises only the OpenID
  Connect Discovery and JWT standards.

  Methods:
    - discover: fetch <issuer>/.well-known/openid-configuration and validate
      it (issuer match, required endpoints, PKCE methods, scopes, grants).
    - jwks: fetch the provider JWKS and report each key's kid, kty, alg, use.
    - decode-token: decode a JWT (header + claims; signature is NOT
      cryptographically verified) and sanity-check alg, kid, iss, aud, exp,
      nbf, iat against the clock, the issuer, and the discovered JWKS.

  Every method writes a diagnostic resource even on failure, so a broken
  endpoint leaves a truthful, queryable record. Endpoints discovered by
  `discover` feed `jwks` and `decode-token` via stored data / CEL.

  ## Quick Start

  ```bash
  swamp extension pull @tagur/oidc-diagnose
  swamp behavior create @tagur/oidc-diagnose login-check \
    --global-arg issuer=https://login.example.com
  swamp behavior run login-check discover
  swamp behavior run login-check jwks
  swamp behavior run login-check decode-token \
    --arg token=<jwt> --arg expectedAudience=<client-id>
  swamp data query 'behavior("login-check")' \
    --select '{"name": name, "findings": attributes.findings}'
  ```
repository: "https://github.com/tagur87/swamp-extensions"
behaviors:
  - oidc-diagnose.ts
workflows: []
vaults: []
drivers: []
datastores: []
reports: []
